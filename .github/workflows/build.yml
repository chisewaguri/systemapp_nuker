name: build

on:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - '.github/workflows/build.yml'
      - 'module/**'
      - 'webui/**'
      - 'update.json'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'module/**'
      - 'webui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set variables
      run: |
        COMMIT_NUM=$(git rev-list --count HEAD)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        VERSION=$(jq -r .version update.json)
        VERSION_CODE=$(jq -r .versionCode update.json)
        ZIP_URL=$(jq -r .zipUrl update.json)
        MODULE_VERSION=$(sed -n 's/^version=//p' module/module.prop)
        MODULE_VERSION_CODE=$(sed -n 's/^versionCode=//p' module/module.prop)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          [ "$GITHUB_REF_NAME" = "$VERSION" ] || { echo "tag does not match update.json" >&2; exit 1; }
          [ "$MODULE_VERSION" = "$VERSION" ] || { echo "module.prop version does not match update.json" >&2; exit 1; }
          [ "$MODULE_VERSION_CODE" = "$VERSION_CODE" ] || { echo "module.prop versionCode does not match update.json" >&2; exit 1; }
          [ "${ZIP_URL##*/}" = "SAN_$VERSION.zip" ] || { echo "zipUrl does not match update.json version" >&2; exit 1; }
        fi
        ZIP_NAME=SAN_$VERSION-$COMMIT_NUM-$COMMIT_HASH
        RELEASE_ZIP_NAME=SAN_$VERSION
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME" >> $GITHUB_ENV

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 'latest'

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Build WebUI
      run: |
        cd webui
        pnpm install --frozen-lockfile
        pnpm lint
        pnpm test
        # releases must ship app descriptions, other builds can go without them
        if ! node scripts/fetch-uad.cjs; then
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then exit 1; fi
          echo "::warning::uad-ng list download failed, building without app descriptions"
        fi
        pnpm build

    - name: Extract changelog for version
      if: github.ref_type == 'tag'
      run: |
        # Extract changelog for the specific version from CHANGELOG.md
        # VERSION already has the v prefix (update.json: "v2.1.0")
        CHANGELOG=$(awk -v version="${{ env.VERSION }}" '
        BEGIN { found=0; content="" }
        /^### v[0-9]+\.[0-9]+\.[0-9]+/ {
          if (found) exit
          if ($0 ~ "### " version) {
            found=1
            next
          }
        }
        found && /^### v[0-9]+\.[0-9]+\.[0-9]+/ { exit }
        found && !/^---$/ { 
          if (content == "") {
            content = $0
          } else {
            content = content "\n" $0
          }
        }
        END { print content }
        ' CHANGELOG.md)
        
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$CHANGELOG" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create dummy zip
      run: |
        # Create dummy zip
        cd module/dummy_zip
        cp -r ../META-INF .
        zip -r dummy.zip *
        mv dummy.zip ../
        
    - name: Create module zip for release
      if: github.ref_type == 'tag'
      run: |
        cd module
        zip -r "${{ env.RELEASE_ZIP_NAME }}.zip" *
        mv "${{ env.RELEASE_ZIP_NAME }}.zip" ../

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: |
          module/
          !module/dummy_zip

    - name: Create release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        body: ${{ env.CHANGELOG }}
        draft: false
        files: ${{ env.RELEASE_ZIP_NAME }}.zip
